name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -n 1)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run JVM tests
        run: ./gradlew :engine:test :ai:test --console=plain

      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/chesspoints"
          KEYSTORE_PATH="$RUNNER_TEMP/chesspoints/release.keystore"
          umask 077
          # PowerShell and other Windows encoders may wrap Base64 at newline
          # boundaries. Remove whitespace before decoding, without logging the
          # secret or accepting arbitrary non-Base64 characters.
          NORMALIZED_KEYSTORE_BASE64="$(printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [ -z "$NORMALIZED_KEYSTORE_BASE64" ] ||
             ! printf '%s' "$NORMALIZED_KEYSTORE_BASE64" | grep -Eq '^[A-Za-z0-9+/]*={0,2}$' ||
             [ $(( ${#NORMALIZED_KEYSTORE_BASE64} % 4 )) -ne 0 ]; then
            echo "RELEASE_KEYSTORE_BASE64 is empty or not standard Base64." >&2
            exit 1
          fi
          if ! printf '%s' "$NORMALIZED_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            rm -f "$KEYSTORE_PATH"
            echo "RELEASE_KEYSTORE_BASE64 could not be decoded." >&2
            exit 1
          fi
          {
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          body: |
            Automated Android release build for ${{ github.ref_name }}.
